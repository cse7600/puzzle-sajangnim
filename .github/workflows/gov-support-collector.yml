name: 기업마당 지원사업 수집기

on:
  schedule:
    - cron: "0 19 * * *" # 04:00 KST
  workflow_dispatch: {} # 수동 실행(Actions 탭에서 Run workflow)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
      SUPABASE_URL: https://nbfoifegbamvtwffbuxv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 수집 스크립트 실행
        run: node scripts/collect-gov-support.mjs

  enrich:
    runs-on: ubuntu-latest
    needs: collect
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://nbfoifegbamvtwffbuxv.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 자격조건 추출 스크립트 실행
        run: node scripts/enrich-gov-support.mjs
